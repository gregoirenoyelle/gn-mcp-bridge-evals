name: Tests

# Layer 1 (server tests, no AI) against a throwaway WordPress started with wp-env.
# Test identities and their Application Passwords are created inside the job
# and disappear with the runner.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  layer1:
    name: Layer 1 (wp-env)
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install wp-env (no lifecycle scripts)
        run: npm ci --ignore-scripts

      - name: Start WordPress
        run: npx --no-install wp-env start

      - name: Create test identities
        run: scripts/ci-setup.sh

      - name: Install the eval suite
        run: python -m pip install -e ".[dev]"

      - name: Plugin versions under test
        run: npx --no-install wp-env run cli wp plugin list --fields=name,status,version

      - name: Run layer 1
        run: python -m pytest -v
