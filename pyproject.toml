[project]
name = "gn-mcp-bridge-evals"
version = "0.1.0"
description = "Evals for the gn-mcp-bridge WordPress plugin, run through its MCP server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
