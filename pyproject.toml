[project]
name = "gn-mcp-bridge-evals"
version = "0.1.0"
description = "Evals for the gn-mcp-bridge WordPress plugin, run through its MCP server"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
    "httpx2>=2.16,<3",
    "python-dotenv>=1.2,<2",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10"]
agent = ["anthropic>=2.8,<3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: site-heavy tests (agent cases with the scripted model), run in their own CI job"]
